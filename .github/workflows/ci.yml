name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Core runtime deps (pandas + numpy). Optional extras (lifetimes,
          # scikit-learn, shap) are intentionally skipped: the core path and
          # the test suite run without them — CLV falls back to a built-in
          # heuristic and the advanced/ ML modules are off the core path.
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        # -o addopts="" guards against any pytest config injecting --cov etc.
        run: python -m pytest tests/ -o addopts=""
